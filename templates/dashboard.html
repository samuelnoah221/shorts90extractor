{% extends "layout.html" %}
{% block content %}
<div class="dashboard-grid">
    
    <div class="panel settings-panel">
        <h3>🛠️ Watermark Eraser Matrix</h3>
        <form action="/process" method="POST" enctype="multipart/form-data">
            <div class="input-group">
                <label>X-Coordinate (Left Edge):</label>
                <input type="number" name="x" value="40">
            </div>
            <div class="input-group">
                <label>Y-Coordinate (Top Edge):</label>
                <input type="number" name="y" value="40">
            </div>
            <div class="input-group">
                <label>Box Width:</label>
                <input type="number" name="w" value="150">
            </div>
            <div class="input-group">
                <label>Box Height:</label>
                <input type="number" name="h" value="60">
            </div>
            
            <h3 style="margin-top:25px;">📁 Drop Video Payload</h3>
            <input type="file" name="video_file" accept="video/*" required><br><br>
            
            <button type="submit" class="run-btn">✨ Execute Extraction Pipeline</button>
        </form>
    </div>

    <div class="panel status-panel">
        <h3>📊 System Live Stream Monitor</h3>
        <div class="console-box">
            <p class="status-text">Core environment operational. Awaiting client upload request...</p>
        </div>
    </div>

</div>
{% endblock %}
